name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Run static checks
        run: |
          python -m py_compile validate.py failure_test.py scripts/analyze_logs.py
          python -m unittest discover -s tests -v
          bash -n backup.sh restore.sh
          docker compose config --quiet

      - name: Build application image
        run: docker compose -p barq-assessment build

      - name: Scan application image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: barq-assessment-app-01:latest
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          exit-code: "0"

      - name: Start services
        run: docker compose -p barq-assessment up -d

      - name: Wait for readiness and validate
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8090/ready > /tmp/barq-ready.json \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' app-01)" = "healthy" ] \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' app-02)" = "healthy" ] \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' app-03)" = "healthy" ] \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' nginx)" = "healthy" ] \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' postgres)" = "healthy" ] \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' redis)" = "healthy" ]; then
                ready=1
                cat /tmp/barq-ready.json
                break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "The application did not become ready within 60 seconds."
            exit 1
          fi
          python validate.py

      - name: Show Compose logs after a failure
        if: failure()
        run: docker compose -p barq-assessment logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -p barq-assessment down
